<body class="registry-live-fob">
  <div class="registry-video-bg" aria-hidden="true">
    <div class="registry-video-fallback"></div>
    <video autoplay muted loop playsinline preload="metadata" poster="">
      <!-- Видео: морской прибой (внешний CDN). При блокировке сети остаётся градиент подложки. -->
      <source
        src="https://videos.pexels.com/video-files/2491281/2491281-hd_1920_1080_24fps.mp4"

      />

        src="https://videos.pexels.com/video-files/1409899/1409899-hd_1280_720_24fps.mp4"
        type="video/mp4"
      />
    </video>
  </div>

  <div class="registry-shell">
    <header class="registry-banner">
      <p class="registry-brand-main">FREIGHT BOX</p>
      <p class="registry-brand-tag">UNPACK YOUR ULTIMATE TARRIF</p>
    </header>

    <div class="registry-toolbar">
      <p class="registry-meta">
        <strong>FOB</strong> · срок действия включает <strong id="registry-today-label">—</strong> · строки после разворота порт × линия
      </p>
      <button type="button" class="registry-btn" id="registry-reload">Обновить</button>
    </div>

    <main class="registry-main">
      <p id="registry-status" class="registry-status" hidden></p>
      <div class="registry-table-card">
        <div class="registry-table-wrap-inner">
          <table class="registry-table">
            <thead id="registry-thead"></thead>
            <tbody id="registry-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="registry-footer">
      <p class="registry-footer-brand">FREIGHT BOX — UNPACK YOUR ULTIMATE TARRIF</p>
    </footer>
  </div>

  <script src="registry-live-fob.js?v=1778940100000"></script>
